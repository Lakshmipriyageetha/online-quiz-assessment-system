<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - QuizMaster</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        /* NAVBAR */
        .navbar {
            background: #1e293b;
            color: white;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .logout-btn {
            background: #ef4444;
            border: none;
            color: white;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* CONTAINER */
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #64748b;
        }

        /* PROFILE CARD */
        .profile-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
        }

        .profile-header h2 {
            margin-bottom: 6px;
        }

        .role {
            color: #2563eb;
            font-weight: bold;
        }

        /* DETAILS */
        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .detail-box {
            background: #f8fafc;
            padding: 18px;
            border-radius: 8px;
        }

        .detail-box label {
            display: block;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 7px;
        }

        .detail-box span {
            font-size: 17px;
            font-weight: 600;
        }

        /* STATS */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            font-size: 30px;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .stat-card p {
            color: #64748b;
        }

        /* PASSWORD */
        .password-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .password-card h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        .update-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .update-btn:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            QuizMaster
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="quiz-management.html">
                Quizzes
            </a>

            <a href="results.html">
                Results
            </a>

            <a href="profile.html">
                Profile
            </a>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <div class="container">

        <!-- TITLE -->
        <div class="page-title">
            <h1>My Profile</h1>
            <p>View your account information and quiz performance.</p>
        </div>


        <!-- PROFILE -->
        <div class="profile-card">

            <div id="loading" class="loading">
                Loading profile...
            </div>

            <div id="profileContent" style="display:none;">

                <div class="profile-header">

                    <div class="avatar" id="avatar">
                        U
                    </div>

                    <div>
                        <h2 id="userName">
                            User
                        </h2>

                        <p class="role" id="userRole">
                            Student
                        </p>
                    </div>

                </div>


                <div class="details">

                    <div class="detail-box">

                        <label>
                            Full Name
                        </label>

                        <span id="name">
                            -
                        </span>

                    </div>


                    <div class="detail-box">

                        <label>
                            Email Address
                        </label>

                        <span id="email">
                            -
                        </span>

                    </div>


                    <div class="detail-box">

                        <label>
                            Account Role
                        </label>

                        <span id="role">
                            -
                        </span>

                    </div>


                    <div class="detail-box">

                        <label>
                            User ID
                        </label>

                        <span id="userId">
                            -
                        </span>

                    </div>

                </div>

            </div>

        </div>


        <!-- STATISTICS -->
        <div class="stats">

            <div class="stat-card">

                <h3 id="totalAttempts">
                    0
                </h3>

                <p>
                    Quiz Attempts
                </p>

            </div>


            <div class="stat-card">

                <h3 id="averageScore">
                    0%
                </h3>

                <p>
                    Average Score
                </p>

            </div>


            <div class="stat-card">

                <h3 id="highestScore">
                    0%
                </h3>

                <p>
                    Highest Score
                </p>

            </div>

        </div>


        <!-- CHANGE PASSWORD -->
        <div class="password-card">

            <h2>
                Change Password
            </h2>

            <form id="passwordForm">

                <div class="form-group">

                    <label>
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="currentPassword"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="update-btn"
                >
                    Update Password
                </button>

            </form>


            <div id="message"></div>

        </div>

    </div>


<script>

    // ==============================
    // LOAD PROFILE
    // ==============================

    async function loadProfile() {

        try {

            const response = await fetch(
                "/api/auth/profile",
                {
                    credentials: "include"
                }
            );

            const data = await response.json();

           if (!response.ok || !data.user) {

    window.location.href = "login.html";

    return;
}

            const user = data.user;


            document.getElementById("loading").style.display =
                "none";

            document.getElementById("profileContent").style.display =
                "block";


            document.getElementById("userName").textContent =
                user.name || "User";

            document.getElementById("name").textContent =
                user.name || "-";

            document.getElementById("email").textContent =
                user.email || "-";

            document.getElementById("role").textContent =
                user.role || "Student";

            document.getElementById("userRole").textContent =
                user.role || "Student";

            document.getElementById("userId").textContent =
                user._id || user.id || "-";


            // First letter avatar

            if (user.name) {

                document.getElementById("avatar").textContent =
                    user.name.charAt(0).toUpperCase();

            }

        } catch (error) {

            console.error(
                "Profile loading error:",
                error
            );

            window.location.href = "login.html";

        }

    }


    // ==============================
    // LOAD STATISTICS
    // ==============================

    async function loadStatistics() {

        try {

            const response = await fetch(
                "/api/results/dashboard",
                {
                    credentials: "include"
                }
            );

            const data = await response.json();

            if (!response.ok || !data.success) {
                return;
            }


            const summary = data.summary;


            document.getElementById("totalAttempts").textContent =
                summary.totalAttempts || 0;


            document.getElementById("averageScore").textContent =
                (summary.averagePercentage || 0) + "%";


            document.getElementById("highestScore").textContent =
                (summary.highestPercentage || 0) + "%";

        } catch (error) {

            console.error(
                "Statistics loading error:",
                error
            );

        }

    }


    // ==============================
    // CHANGE PASSWORD
    // ==============================

    document
        .getElementById("passwordForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const currentPassword =
                document.getElementById("currentPassword").value;

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("message");


            if (newPassword !== confirmPassword) {

                message.style.color = "red";

                message.textContent =
                    "New passwords do not match.";

                return;

            }


            if (newPassword.length < 6) {

                message.style.color = "red";

                message.textContent =
                    "Password must be at least 6 characters.";

                return;

            }


            try {

                const response = await fetch(
                    "/api/auth/change-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({
                            currentPassword,
                            newPassword
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok || !data.success) {

                    message.style.color = "red";

                    message.textContent =
                        data.message ||
                        "Failed to change password.";

                    return;

                }


                message.style.color = "green";

                message.textContent =
                    "Password updated successfully.";


                document
                    .getElementById("passwordForm")
                    .reset();


            } catch (error) {

                console.error(error);

                message.style.color = "red";

                message.textContent =
                    "Server error. Please try again.";

            }

        });


    // ==============================
    // LOGOUT
    // ==============================

    async function logout() {

        try {

            await fetch(
                "/api/auth/logout",
                {
                    method: "POST",
                    credentials: "include"
                }
            );

            window.location.href =
                "login.html";

        } catch (error) {

            console.error(error);

        }

    }


    // ==============================
    // START
    // ==============================

    loadProfile();
    loadStatistics();

</script>

</body>
</html>
