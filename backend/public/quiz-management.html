<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Management | QuizMaster</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        /* ================= NAVBAR ================= */

        nav {
            background: #111827;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        nav h2 {
            font-size: 24px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            border: none;
            color: white;
            text-decoration: none;

            padding: 10px 16px;
            border-radius: 7px;

            cursor: pointer;
            font-size: 14px;
        }

        .dashboard-btn {
            background: #374151;
        }

        .dashboard-btn:hover {
            background: #4b5563;
        }

        .logout-btn {
            background: #dc2626;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        /* ================= HEADER ================= */

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;
        }

        /* ================= MESSAGE ================= */

        .message {
            display: none;

            padding: 15px 18px;
            border-radius: 8px;

            margin-bottom: 20px;
            font-weight: bold;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .message.info {
            display: block;
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        /* ================= CARD ================= */

        .card {
            background: white;
            padding: 28px;
            border-radius: 14px;

            margin-bottom: 25px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        /* ================= LOADING ================= */

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .spinner {
            width: 38px;
            height: 38px;

            border: 4px solid #e5e7eb;
            border-top-color: #2563eb;

            border-radius: 50%;

            margin: 0 auto 15px;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        /* ================= STATS ================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: white;

            padding: 22px;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.07);
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;

            margin-bottom: 5px;
        }

        .stat-label {
            color: #6b7280;
            font-size: 14px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .required {
            color: #dc2626;
        }

        input,
        textarea {

            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            font-family: inherit;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {

            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,0.1);
        }

        .form-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 18px;
        }

        /* ================= BUTTONS ================= */

        .button-row {

            display: flex;

            gap: 12px;

            margin-top: 10px;
        }

        .primary-btn {

            background: #2563eb;

            color: white;

            border: none;

            padding: 13px 22px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            font-size: 15px;
        }

        .primary-btn:hover {
            background: #1d4ed8;
        }

        .primary-btn:disabled {

            background: #93c5fd;

            cursor: not-allowed;
        }

        .secondary-btn {

            background: #6b7280;

            color: white;

            border: none;

            padding: 13px 22px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .secondary-btn:hover {
            background: #4b5563;
        }

        /* ================= SEARCH ================= */

        .search-box {

            margin-bottom: 20px;
        }

        .search-box input {

            max-width: 500px;
        }

        /* ================= QUIZ GRID ================= */

        .quiz-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .quiz-card {

            border: 1px solid #e5e7eb;

            border-radius: 12px;

            padding: 22px;

            background: white;

            transition: 0.2s;
        }

        .quiz-card:hover {

            border-color: #93c5fd;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,0.08);
        }

        .quiz-title {

            font-size: 21px;

            font-weight: bold;

            margin-bottom: 10px;

            color: #111827;
        }

        .quiz-description {

            color: #6b7280;

            line-height: 1.5;

            margin-bottom: 15px;
        }

        .quiz-meta {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 18px;
        }

        .meta {

            background: #eff6ff;

            color: #1d4ed8;

            padding: 7px 10px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;
        }

        /* ================= QUIZ ACTIONS ================= */

        .quiz-actions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;
        }

        .action-btn {

            border: none;

            padding: 10px;

            border-radius: 7px;

            color: white;

            cursor: pointer;

            font-weight: bold;
        }

        .questions-btn {
            background: #7c3aed;
        }

        .questions-btn:hover {
            background: #6d28d9;
        }

        .take-btn {
            background: #059669;
        }

        .take-btn:hover {
            background: #047857;
        }

        .edit-btn {
            background: #f59e0b;
        }

        .edit-btn:hover {
            background: #d97706;
        }

        .delete-btn {
            background: #dc2626;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        /* ================= EMPTY ================= */

        .empty {

            text-align: center;

            padding: 50px 20px;

            color: #6b7280;
        }

        .empty-icon {

            font-size: 50px;

            margin-bottom: 15px;
        }

        /* ================= ERROR BOX ================= */

        .error-box {

            background: #fee2e2;

            border: 1px solid #fca5a5;

            color: #991b1b;

            padding: 20px;

            border-radius: 10px;

            line-height: 1.6;
        }

        .retry-btn {

            margin-top: 15px;

            background: #2563eb;

            color: white;

            border: none;

            padding: 10px 18px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width: 850px) {

            .stats {

                grid-template-columns:
                    repeat(2, 1fr);
            }

            .quiz-grid {

                grid-template-columns: 1fr;
            }

            .form-grid {

                grid-template-columns: 1fr;
            }

        }

        @media(max-width: 600px) {

            nav {

                padding: 15px 20px;
            }

            .nav-buttons {

                flex-direction: column;
            }

            .stats {

                grid-template-columns: 1fr;
            }

            .quiz-actions {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav>

    <h2>QuizMaster</h2>

    <div class="nav-buttons">

        <a
            href="dashboard.html"
            class="nav-btn dashboard-btn"
        >
            Dashboard
        </a>

        <button
            class="nav-btn logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<div class="container">


    <!-- ================= HEADER ================= -->

    <div class="page-header">

        <h1>
            Quiz Management
        </h1>

        <p>
            Create, manage and organize your quizzes.
        </p>

    </div>


    <!-- ================= MESSAGE ================= -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- ================= STATS ================= -->

    <div class="stats">

        <div class="stat-card">

            <div
                id="totalQuizzes"
                class="stat-number"
            >
                0
            </div>

            <div class="stat-label">
                Total Quizzes
            </div>

        </div>


        <div class="stat-card">

            <div
                id="totalQuestions"
                class="stat-number"
            >
                0
            </div>

            <div class="stat-label">
                Total Questions
            </div>

        </div>


        <div class="stat-card">

            <div
                id="totalSubjects"
                class="stat-number"
            >
                0
            </div>

            <div class="stat-label">
                Subjects
            </div>

        </div>


        <div class="stat-card">

            <div
                id="averageDuration"
                class="stat-number"
            >
                0
            </div>

            <div class="stat-label">
                Avg. Minutes
            </div>

        </div>

    </div>


    <!-- ================= CREATE QUIZ ================= -->

    <div class="card">

        <h2>
            Create New Quiz
        </h2>


        <form id="quizForm">


            <div class="form-grid">


                <div class="form-group">

                    <label for="title">

                        Quiz Title
                        <span class="required">*</span>

                    </label>

                    <input
                        id="title"
                        type="text"
                        placeholder="Example: JavaScript Basics Quiz"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="subject">

                        Subject
                        <span class="required">*</span>

                    </label>

                    <input
                        id="subject"
                        type="text"
                        placeholder="Example: JavaScript"
                        required
                    >

                </div>


            </div>


            <div class="form-group">

                <label for="description">

                    Description
                    <span class="required">*</span>

                </label>

                <textarea
                    id="description"
                    placeholder="Enter quiz description..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="duration">

                    Duration (minutes)
                    <span class="required">*</span>

                </label>

                <input
                    id="duration"
                    type="number"
                    min="1"
                    max="300"
                    placeholder="30"
                    required
                >

            </div>


            <div class="button-row">

                <button
                    id="createQuizBtn"
                    type="submit"
                    class="primary-btn"
                >
                    Create Quiz
                </button>


                <button
                    type="button"
                    class="secondary-btn"
                    onclick="clearQuizForm()"
                >
                    Clear
                </button>

            </div>


        </form>

    </div>


    <!-- ================= QUIZ LIST ================= -->

    <div class="card">

        <h2>
            Available Quizzes
        </h2>


        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="Search quiz by title or subject..."
                oninput="filterQuizzes()"
            >

        </div>


        <div
            id="quizList"
        >

            <div class="loading">

                <div class="spinner"></div>

                Loading quizzes...

            </div>

        </div>

    </div>


</div>


<script>


/* =====================================================
   VARIABLES
===================================================== */

let allQuizzes = [];

let isCreating = false;


/* =====================================================
   API HELPER
   This prevents the page from silently hanging.
===================================================== */

async function apiRequest(
    url,
    options = {}
) {

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            () => controller.abort(),
            10000
        );


    try {

        const response =
            await fetch(
                url,
                {
                    ...options,
                    credentials: "include",
                    cache: "no-store",
                    signal: controller.signal,

                    headers: {
                        "Accept":
                            "application/json",

                        ...(options.headers || {})
                    }
                }
            );


        const rawText =
            await response.text();


        let data = null;


        if (rawText) {

            try {

                data =
                    JSON.parse(rawText);

            }
            catch (error) {

                console.error(
                    "Server returned non-JSON:",
                    rawText
                );

            }

        }


        if (!response.ok) {

            throw new Error(
                data?.message ||
                `Server error: HTTP ${response.status}`
            );

        }


        return data;

    }
    catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            throw new Error(
                "Server request timed out. Please make sure Node.js server is running."
            );

        }


        throw error;

    }
    finally {

        clearTimeout(timeout);

    }

}


/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        console.log(
            "Quiz Management page loaded"
        );

        await loadQuizzes();

    }
);


/* =====================================================
   LOAD QUIZZES
===================================================== */

async function loadQuizzes() {

    const list =
        document.getElementById(
            "quizList"
        );


    list.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading quizzes...

        </div>

    `;


    try {

        console.log(
            "Calling GET /api/quizzes"
        );


        const data =
            await apiRequest(
                "/api/quizzes",
                {
                    method: "GET"
                }
            );


        console.log(
            "Quiz API response:",
            data
        );


        if (
            !data ||
            !data.success
        ) {

            throw new Error(
                data?.message ||
                "Quiz data was not received."
            );

        }


        allQuizzes =
            Array.isArray(data.quizzes)
                ? data.quizzes
                : [];


        console.log(
            "Quizzes loaded:",
            allQuizzes
        );


        updateStatistics();

        renderQuizzes(
            allQuizzes
        );


    }
    catch (error) {

        console.error(
            "LOAD QUIZZES ERROR:",
            error
        );


        list.innerHTML = `

            <div class="error-box">

                <strong>
                    Unable to load quizzes.
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <br><br>

                <strong>
                    Check:
                </strong>

                <br>

                1. Node.js server is running.
                <br>

                2. MongoDB is connected.
                <br>

                3. You are logged in.
                <br>

                4. Browser console for errors.

                <br>

                <button
                    class="retry-btn"
                    onclick="loadQuizzes()"
                >
                    Retry
                </button>

            </div>

        `;


        showMessage(
            error.message,
            "error"
        );

    }

}


/* =====================================================
   RENDER QUIZZES
===================================================== */

function renderQuizzes(
    quizzes
) {

    const list =
        document.getElementById(
            "quizList"
        );


    if (
        !Array.isArray(quizzes) ||
        quizzes.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📝
                </div>

                <h3>
                    No quizzes found
                </h3>

                <p style="margin-top:10px;">
                    Create your first quiz using
                    the form above.
                </p>

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    const grid =
        document.createElement(
            "div"
        );

    grid.className =
        "quiz-grid";


    quizzes.forEach(
        function(quiz) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "quiz-card";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "quiz-title";

            title.textContent =
                quiz.title || "Untitled Quiz";


            const description =
                document.createElement(
                    "div"
                );

            description.className =
                "quiz-description";

            description.textContent =
                quiz.description ||
                "No description available.";


            const meta =
                document.createElement(
                    "div"
                );

            meta.className =
                "quiz-meta";


            const subject =
                document.createElement(
                    "span"
                );

            subject.className =
                "meta";

            subject.textContent =
                `📚 ${quiz.subject || "General"}`;


            const duration =
                document.createElement(
                    "span"
                );

            duration.className =
                "meta";

            duration.textContent =
                `⏱ ${quiz.duration || 0} min`;


            const questions =
                document.createElement(
                    "span"
                );

            questions.className =
                "meta";

            const questionCount =
                Array.isArray(
                    quiz.questions
                )
                    ? quiz.questions.length
                    : (
                        quiz.questionCount ||
                        0
                    );

            questions.textContent =
                `❓ ${questionCount} questions`;


            meta.appendChild(
                subject
            );

            meta.appendChild(
                duration
            );

            meta.appendChild(
                questions
            );


            /* ACTION BUTTONS */

            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "quiz-actions";


            const questionBtn =
                document.createElement(
                    "button"
                );

            questionBtn.className =
                "action-btn questions-btn";

            questionBtn.textContent =
                "Questions";

            questionBtn.onclick =
                function() {

                    manageQuestions(
                        quiz._id
                    );

                };


            const takeBtn =
                document.createElement(
                    "button"
                );

            takeBtn.className =
                "action-btn take-btn";

            takeBtn.textContent =
                "Take Quiz";

            takeBtn.onclick =
                function() {

                    takeQuiz(
                        quiz._id
                    );

                };


            const editBtn =
                document.createElement(
                    "button"
                );

            editBtn.className =
                "action-btn edit-btn";

            editBtn.textContent =
                "Edit";

            editBtn.onclick =
                function() {

                    editQuiz(
                        quiz
                    );

                };


            const deleteBtn =
                document.createElement(
                    "button"
                );

            deleteBtn.className =
                "action-btn delete-btn";

            deleteBtn.textContent =
                "Delete";

            deleteBtn.onclick =
                function() {

                    deleteQuiz(
                        quiz._id,
                        quiz.title
                    );

                };


            actions.appendChild(
                questionBtn
            );

            actions.appendChild(
                takeBtn
            );

            actions.appendChild(
                editBtn
            );

            actions.appendChild(
                deleteBtn
            );


            card.appendChild(
                title
            );

            card.appendChild(
                description
            );

            card.appendChild(
                meta
            );

            card.appendChild(
                actions
            );


            grid.appendChild(
                card
            );

        }
    );


    list.appendChild(
        grid
    );

}


/* =====================================================
   CREATE QUIZ
===================================================== */

document
    .getElementById(
        "quizForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (isCreating) {
                return;
            }


            const title =
                document
                    .getElementById(
                        "title"
                    )
                    .value
                    .trim();


            const subject =
                document
                    .getElementById(
                        "subject"
                    )
                    .value
                    .trim();


            const description =
                document
                    .getElementById(
                        "description"
                    )
                    .value
                    .trim();


            const duration =
                Number(
                    document
                        .getElementById(
                            "duration"
                        )
                        .value
                );


            if (!title) {

                showMessage(
                    "Please enter quiz title.",
                    "error"
                );

                return;

            }


            if (!subject) {

                showMessage(
                    "Please enter subject.",
                    "error"
                );

                return;

            }


            if (!description) {

                showMessage(
                    "Please enter description.",
                    "error"
                );

                return;

            }


            if (
                !Number.isFinite(duration) ||
                duration < 1
            ) {

                showMessage(
                    "Duration must be at least 1 minute.",
                    "error"
                );

                return;

            }


            try {

                isCreating = true;


                const button =
                    document.getElementById(
                        "createQuizBtn"
                    );


                button.disabled =
                    true;

                button.textContent =
                    "Creating Quiz...";


                showMessage(
                    "Creating quiz...",
                    "info"
                );


                const data =
                    await apiRequest(
                        "/api/quizzes",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    title:
                                        title,

                                    subject:
                                        subject,

                                    description:
                                        description,

                                    duration:
                                        duration

                                })

                        }
                    );


                console.log(
                    "Create quiz response:",
                    data
                );


                if (
                    !data ||
                    !data.success
                ) {

                    throw new Error(
                        data?.message ||
                        "Quiz was not created."
                    );

                }


                showMessage(
                    "✓ Quiz created successfully!",
                    "success"
                );


                clearQuizForm();


                await loadQuizzes();


            }
            catch (error) {

                console.error(
                    "CREATE QUIZ ERROR:",
                    error
                );


                showMessage(
                    error.message,
                    "error"
                );

            }
            finally {

                isCreating =
                    false;


                const button =
                    document.getElementById(
                        "createQuizBtn"
                    );


                button.disabled =
                    false;

                button.textContent =
                    "Create Quiz";

            }

        }
    );


/* =====================================================
   EDIT QUIZ
===================================================== */

async function editQuiz(
    quiz
) {

    const title =
        prompt(
            "Enter new quiz title:",
            quiz.title || ""
        );


    if (title === null) {
        return;
    }


    const subject =
        prompt(
            "Enter new subject:",
            quiz.subject || ""
        );


    if (subject === null) {
        return;
    }


    const description =
        prompt(
            "Enter new description:",
            quiz.description || ""
        );


    if (description === null) {
        return;
    }


    const durationInput =
        prompt(
            "Enter duration in minutes:",
            quiz.duration || 30
        );


    if (durationInput === null) {
        return;
    }


    const duration =
        Number(durationInput);


    if (
        !title.trim() ||
        !subject.trim() ||
        !description.trim() ||
        !Number.isFinite(duration) ||
        duration < 1
    ) {

        showMessage(
            "Please enter valid quiz details.",
            "error"
        );

        return;

    }


    try {

        showMessage(
            "Updating quiz...",
            "info"
        );


        const data =
            await apiRequest(
                `/api/quizzes/${encodeURIComponent(quiz._id)}`,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            title:
                                title.trim(),

                            subject:
                                subject.trim(),

                            description:
                                description.trim(),

                            duration:
                                duration

                        })

                }
            );


        if (
            !data ||
            !data.success
        ) {

            throw new Error(
                data?.message ||
                "Quiz update failed."
            );

        }


        showMessage(
            "Quiz updated successfully.",
            "success"
        );


        await loadQuizzes();


    }
    catch (error) {

        console.error(
            "EDIT QUIZ ERROR:",
            error
        );


        showMessage(
            error.message,
            "error"
        );

    }

}


/* =====================================================
   DELETE QUIZ
===================================================== */

async function deleteQuiz(
    quizId,
    quizTitle
) {

    if (!quizId) {

        showMessage(

    }


    const confirmed =
        confirm(
            `Are you sure you want to delete "${quizTitle}"?\n\nThis action cannot be undone.`

    if (!confirmed) {

    try {

        showMessage(
            "Deleting quiz...",
            "info"
        );


        const data =
            await apiRequest(
                `/api/quizzes/${encodeURIComponent(quizId)}`,
                {

            );


        if (
            !data ||

        showMessage(
            "Quiz deleted successfully.",

    }
    catch (error) {

}

/* =====================================================
   SEARCH
===================================================== */

function filterQuizzes() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    if (!search) {

        renderQuizzes(
            allQuizzes
        );

        return;

    }


    const filtered =
        allQuizzes.filter(
            function(quiz) {

                const title =
                    String(
                        quiz.title || ""
                    ).toLowerCase();


                const subject =
                    String(
                        quiz.subject || ""
                    ).toLowerCase();


                const description =
                    String(
                        quiz.description || ""
                    ).toLowerCase();


                return (
                    title.includes(search) ||
                    subject.includes(search) ||
                    description.includes(search)
                );

            }
        );


    renderQuizzes(
        filtered
    );

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics() {

    const total =
        allQuizzes.length;


    let totalQuestions = 0;

    let totalDuration = 0;


    const subjects =
        new Set();


    allQuizzes.forEach(
        function(quiz) {

            if (
                Array.isArray(
                    quiz.questions
                )
            ) {

                totalQuestions +=
                    quiz.questions.length;

            }
            else if (
                quiz.questionCount
            ) {

                totalQuestions +=
                    Number(
                        quiz.questionCount
                    ) || 0;

            }


            totalDuration +=
                Number(
                    quiz.duration
                ) || 0;


            if (
                quiz.subject
            ) {

                subjects.add(
                    String(
                        quiz.subject
                    ).trim().toLowerCase()
                );

            }

        }
    );


    const averageDuration =
        total > 0
            ? Math.round(
                totalDuration / total
            )
            : 0;


    document.getElementById(
        "totalQuizzes"
    ).textContent =
        total;


    document.getElementById(
        "totalQuestions"
    ).textContent =
        totalQuestions;


    document.getElementById(
        "totalSubjects"
    ).textContent =
        subjects.size;


    document.getElementById(
        "averageDuration"
    ).textContent =
        averageDuration;

}

function clearQuizForm() {

/* =====================================================
   MESSAGE
===================================================== */

let messageTimer = null;


function showMessage(
    message,
    type
) {

    const box =
        document.getElementById(
            "message"
        );


    clearTimeout(
        messageTimer
    );


    box.className =
        `message ${type}`;


    box.textContent =
        message;


    box.style.display =
        "block";


    messageTimer =
        setTimeout(
            function() {

                box.style.display =
                    "none";

            },
            5000
        );

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ?? "";


    return div.innerHTML;

}
